  .marca{
    display:flex; align-items:center; gap:16px;
    padding:18px 28px; position:relative; overflow:hidden;
    background:linear-gradient(180deg, #14161A, #1D2126);
    box-shadow:0 4px 18px rgba(0,0,0,0.35);
  }
  .marca .circuito{
    position:absolute; top:0; right:0; height:100%; width:420px;
    opacity:0.35; pointer-events:none;
  }
  .marca::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:3px;
    background:var(--cian); box-shadow:0 0 8px var(--cian);
  }
  .marca .tuerca{
    width:46px;height:46px;border-radius:10px;
    background:#10151A; border:1.5px solid var(--cian); color:var(--cian);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0; position:relative; z-index:1;
    box-shadow:0 0 10px rgba(51,199,224,0.35);
  }
  .marca .tuerca svg{width:26px;height:26px;}
  .marca h1{
    font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:1px;
    text-transform:uppercase; font-size:26px; margin:0; line-height:1;
    color:var(--hueso); position:relative; z-index:1;
  }
  .marca p{margin:4px 0 0; font-size:11px; color:var(--cian); letter-spacing:2.5px; text-transform:uppercase; font-weight:500; position:relative; z-index:1;}
  .marca p.contacto{
    color:var(--hueso-tenue); letter-spacing:.3px; text-transform:none; font-weight:400;
    font-size:12px; margin-top:6px;
  }
  .wrap{max-width:760px; margin:0 auto; padding:32px 20px 60px;}

  /* --- login --- */
  .login-box{
    max-width:400px; margin:220px auto 0;
    background:var(--asfalto-2); border:1px solid var(--linea); border-radius:10px;
    padding:28px;
  }
  .login-tabs{display:flex; gap:0; margin-bottom:22px; border-bottom:1px solid var(--linea);}
  .login-tabs button{
    flex:1; background:none; border:none; color:var(--hueso-tenue);
    font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:1px; font-size:13px;
    padding:10px 0; cursor:pointer; border-bottom:3px solid transparent;
  }
  .login-tabs button.activo{color:var(--cian); border-bottom-color:var(--cian);}
  label{display:block; font-size:12px; color:var(--hueso-tenue); margin:14px 0 6px; letter-spacing:.5px;}
  input, select, textarea{
    width:100%; min-width:0; box-sizing:border-box;
    background:var(--asfalto); border:1px solid var(--linea); color:var(--hueso);
    padding:10px 12px; border-radius:6px; font-size:14px; font-family:'IBM Plex Sans', sans-serif;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--cian);}
  .grid2-fecha{grid-template-columns:1fr 1fr;}
  button.accion{
    margin-top:18px; width:100%; background:var(--cian); color:var(--asfalto);
    border:none; padding:12px; border-radius:6px; font-family:'Rajdhani',sans-serif;
    font-weight:600; text-transform:uppercase; letter-spacing:1px; font-size:13px; cursor:pointer;
  }
  button.accion:active{transform:scale(0.98);}
  button.secundario{
    background:none; border:1px solid var(--linea); color:var(--hueso);
  }
  .error{color:var(--rojo); font-size:13px; margin-top:10px; min-height:16px;}

<script>
const app = document.getElementById('app');
let sesion = null; // {tipo:'admin'} o {tipo:'cliente', usuario, nombre}

async function getClientes(){
  try{
    const snap = await db.ref('clientes').once('value');
    const val = snap.val() || {};
    return Object.values(val);
  } catch(e){ console.error(e); return []; }
}
async function agregarCliente(cliente){
  await db.ref('clientes/' + cliente.usuario).set(cliente);
}
async function moverCliente(usuarioViejo, usuarioNuevo, cliente){
  await db.ref('clientes/' + usuarioNuevo).set(cliente);
  if(usuarioNuevo !== usuarioViejo){
    await db.ref('clientes/' + usuarioViejo).remove();
    const snap = await db.ref('trabajos/' + usuarioViejo).once('value');
    if(snap.exists()){
      await db.ref('trabajos/' + usuarioNuevo).set(snap.val());
      await db.ref('trabajos/' + usuarioViejo).remove();
    }
  }
}
async function getTrabajosDeCliente(patente){
  try{
    const snap = await db.ref('trabajos/' + patente).once('value');
    const val = snap.val() || {};
    return Object.keys(val)
      .map(id => ({id, ...val[id]}))
      .filter(t => t && t.fecha);
  } catch(e){ console.error(e); return []; }
}
async function getTodosLosTrabajos(){
  try{
    const snap = await db.ref('trabajos').once('value');
    const val = snap.val() || {};
    const lista = [];
    Object.keys(val).forEach(patente => {
      const deEsaPatente = val[patente];
      if(deEsaPatente && typeof deEsaPatente === 'object'){
        Object.keys(deEsaPatente).forEach(id => {
          const t = deEsaPatente[id];
          if(t && typeof t === 'object' && t.fecha){
            lista.push({id, clienteUsuario: patente, ...t});
          }
        });
      }
    });
    return lista;
  } catch(e){ console.error(e); return []; }
}
async function agregarTrabajo(patente, trabajo){
  await db.ref('trabajos/' + patente).push(trabajo);
}
async function eliminarTrabajo(patente, id){
  await db.ref('trabajos/' + patente + '/' + id).remove();
}
async function actualizarTrabajo(patente, id, trabajo){
  await db.ref('trabajos/' + patente + '/' + id).set(trabajo);
}

function renderLogin(){
  app.innerHTML = `

      </div>
    </div>
  `;

      document.getElementById('loginPass').placeholder = 'nombre';
    } else {

      document.getElementById('labelPass').textContent = 'Contraseña';
      document.getElementById('loginUser').placeholder = 'usuario';
      document.getElementById('loginPass').placeholder = 'contraseña';
    }
  }
  document.getElementById('tabCliente').onclick = () => { modo='cliente'; document.getElementById('tabCliente').classList.add('activo'); document.getElementById('tabAdmin').classList.remove('activo'); actualizarLabels(); limpiarCampos(); };
  document.getElementById('tabAdmin').onclick = () => { modo='admin'; document.getElementById('tabAdmin').classList.add('activo'); document.getElementById('tabCliente').classList.remove('activo'); actualizarLabels(); limpiarCampos(); };
  function limpiarCampos(){
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    document.getElementById('loginError').textContent = '';
  }
  actualizarLabels();

  document.getElementById('loginUser').oninput = (e) => {
    if(modo === 'cliente'){
      const pos = e.target.selectionStart;
      e.target.value = e.target.value.toUpperCase();
      e.target.setSelectionRange(pos, pos);
    }
  };

  document.getElementById('btnEntrar').onclick = async () => {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    const err = document.getElementById('loginError');
    err.textContent = '';
    if(modo === 'admin'){
      if(u === 'benja2014' && p === 'jurere2027'){
        sesion = {tipo:'admin'};
        renderAdmin();
      } else {
        err.textContent = 'Usuario o contraseña de taller incorrectos.';

    } else {
      const clientes = await getClientes();
      const uNorm = u.toUpperCase().replace(/\s+/g,'');
      const c = clientes.find(c => c.usuario === uNorm && c.password.trim().toLowerCase() === p.trim().toLowerCase());
      if(c){
        sesion = {tipo:'cliente', usuario:c.usuario, nombre:c.nombre};
        renderCliente();
      } else {
        err.textContent = 'Usuario o contraseña incorrectos.';
      }

  };
}

async function renderCliente(){
  const clientes = await getClientes();
  const yo = clientes.find(c => c.usuario === sesion.usuario);
  const trabajos = (await getTrabajosDeCliente(sesion.usuario))
    .sort((a,b) => (Number(a.kilometraje)||0) - (Number(b.kilometraje)||0) || a.fecha.localeCompare(b.fecha));

  app.innerHTML = `
    <div class="topbar">
      <div class="quien">Cliente: <b>${yo ? yo.nombre : sesion.usuario}</b>${yo && yo.vehiculo ? ' — ' + yo.vehiculo : ''}</div>
      <button class="salir" id="btnSalir">Salir</button>
    </div>
    <div id="listaTicket"></div>
  `;
  document.getElementById('btnSalir').onclick = () => { sesion = null; renderLogin(); };

  const cont = document.getElementById('listaTicket');
  if(trabajos.length === 0){
    cont.innerHTML = '<div class="vacio">Todavía no hay trabajos registrados en tu cuenta.</div>';
  } else {
    cont.innerHTML = trabajos.map(t => `
      <div class="ticket">
        <div class="ticket-top">
          <div>
            <div class="ticket-fecha">${t.fecha}${t.kilometraje ? ` · ${Number(t.kilometraje).toLocaleString('es-AR')} km` : ''}</div>
            <div class="ticket-vehiculo">${t.vehiculo || ''}</div>
          </div>
        </div>
        <div class="ticket-desc">${t.descripcion}</div>
        ${t.repuestos ? `<div class="ticket-repuestos">Repuestos: ${t.repuestos}</div>` : ''}
        ${t.costo ? `<div class="ticket-costo">$ ${Number(t.costo).toLocaleString('es-AR')}</div>` : ''}
      </div>
    `).join('');
  }
}

  app.innerHTML = `

async function pintarPanelClientes(){
  const clientes = await getClientes();
  const panel = document.getElementById('panelClientes');
  panel.innerHTML = `
    <div class="caja">
      <h3 id="tituloFormCliente">Nuevo cliente</h3>
      <p class="sub">El cliente va a ingresar con la patente como usuario y su nombre como contraseña.</p>
      <div class="grid2">
        <div><label>Patente</label><input id="cPatente" placeholder="AB123CD" style="text-transform:uppercase"></div>
        <div><label>Nombre</label><input id="cNombre" placeholder="Juan Pérez"></div>
      </div>
      <div class="grid2">
        <div><label>Vehículo</label><input id="cVehiculo" placeholder="Ford Fiesta"></div>
        <div><label>Teléfono (opcional)</label><input id="cTelefono" placeholder="011 5555-5555"></div>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="accion" id="btnCrearCliente" style="flex:1;">Crear cliente</button>
        <button class="accion secundario" id="btnCancelarEdicionCliente" style="flex:1; display:none;">Cancelar edición</button>
      </div>
      <div class="error" id="clienteError"></div>
    </div>
    <div class="caja">
      <h3>Clientes registrados (${clientes.length})</h3>
      <div class="lista-clientes" id="listaClientes"></div>
    </div>
  `;
  let edicionClienteActual = null; // usuario original antes de editar
  function cargarClienteEnFormulario(c){
    edicionClienteActual = c.usuario;
    document.getElementById('tituloFormCliente').textContent = `Editando cliente ${c.usuario}`;
    document.getElementById('cPatente').value = c.patente || c.usuario;
    document.getElementById('cNombre').value = c.nombre || '';
    document.getElementById('cVehiculo').value = c.vehiculo || '';
    document.getElementById('cTelefono').value = c.telefono || '';
    document.getElementById('btnCrearCliente').textContent = 'Guardar cambios';
    document.getElementById('btnCancelarEdicionCliente').style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function cancelarEdicionCliente(){
    edicionClienteActual = null;
    document.getElementById('tituloFormCliente').textContent = 'Nuevo cliente';
    document.getElementById('cPatente').value = '';
    document.getElementById('cNombre').value = '';
    document.getElementById('cVehiculo').value = '';
    document.getElementById('cTelefono').value = '';
    document.getElementById('btnCrearCliente').textContent = 'Crear cliente';
    document.getElementById('btnCancelarEdicionCliente').style.display = 'none';
  }
  document.getElementById('btnCancelarEdicionCliente').onclick = cancelarEdicionCliente;
  const lista = document.getElementById('listaClientes');
  document.getElementById('cPatente').oninput = (e) => {
    const pos = e.target.selectionStart;
    e.target.value = e.target.value.toUpperCase();
    e.target.setSelectionRange(pos, pos);
  };
  lista.innerHTML = clientes.length === 0
    ? '<div class="vacio">Todavía no creaste ningún cliente.</div>'
    : clientes.map(c => `
      <div class="fila-cliente">
        <span class="u">${c.usuario}</span>
        <span class="nombre-vehiculo">${c.nombre} — ${c.vehiculo||'sin vehículo'}</span>
        <button class="accion secundario btn-editar-cliente" data-usuario="${c.usuario}">Editar</button>
      </div>`).join('');
  document.querySelectorAll('.btn-editar-cliente').forEach(btn => {
    btn.onclick = () => {
      const c = clientes.find(x => x.usuario === btn.dataset.usuario);
      if(c) cargarClienteEnFormulario(c);
    };
  });

  document.getElementById('btnCrearCliente').onclick = async () => {
    const nombre = document.getElementById('cNombre').value.trim();
    const patente = document.getElementById('cPatente').value.trim();
    const vehiculo = document.getElementById('cVehiculo').value.trim();
    const telefono = document.getElementById('cTelefono').value.trim();
    const err = document.getElementById('clienteError');
    if(!nombre || !patente){
      err.textContent = 'Completá al menos la patente y el nombre.'; return;
    }
    const usuario = patente.toUpperCase().replace(/\s+/g,'');
    const password = nombre;
    const actuales = await getClientes();
    if(edicionClienteActual){
      if(usuario !== edicionClienteActual && actuales.some(c => c.usuario === usuario)){
        err.textContent = 'Ya hay un cliente cargado con esa patente.'; return;
      }
      await moverCliente(edicionClienteActual, usuario, {usuario, password, nombre, vehiculo, telefono, patente: usuario});
    } else {
      if(actuales.some(c => c.usuario === usuario)){
        err.textContent = 'Ya hay un cliente cargado con esa patente.'; return;
      }
      await agregarCliente({usuario, password, nombre, vehiculo, telefono, patente: usuario});
    }
    await pintarPanelClientes();
    await pintarPanelTrabajos();
  };
}

    document.getElementById('tFecha').value = '';
    document.getElementById('tDescripcion').value = '';
    document.getElementById('tKilometraje').value = '';
    document.getElementById('tCosto').value = '';
    document.getElementById('tRepuestos').value = '';
    document.getElementById('btnCrearTrabajo').textContent = 'Registrar trabajo';
    document.getElementById('btnCancelarEdicion').style.display = 'none';
  }
  document.getElementById('btnCancelarEdicion').onclick = cancelarEdicion;
  let filtroActual = '';
  let filtradosActuales = trabajos;
  function pintarLista(filtro){
    filtroActual = filtro;
    filtradosActuales = filtro
      ? trabajos.filter(t => t.clienteUsuario.includes(filtro))
      : trabajos;
    const lista = document.getElementById('listaTrabajosAdmin');
    lista.innerHTML = filtradosActuales.length === 0 ? '<div class="vacio">No hay trabajos para mostrar.</div>' :
      filtradosActuales.map(t => {
        const cli = clientes.find(c => c.usuario === t.clienteUsuario);
        return `
        <div class="ticket" data-patente="${t.clienteUsuario}" data-id="${t.id}">
          <div class="ticket-top">
            <div>
              <div class="ticket-fecha">${t.fecha}${t.kilometraje ? ` · ${Number(t.kilometraje).toLocaleString('es-AR')} km` : ''}</div>
              <div class="ticket-vehiculo">${cli ? cli.nombre : t.clienteUsuario} — ${t.vehiculo || (cli?cli.vehiculo:'')} (${t.clienteUsuario})</div>
            </div>
          </div>
          <div class="ticket-desc">${t.descripcion}</div>
          ${t.repuestos ? `<div class="ticket-repuestos">Repuestos: ${t.repuestos}</div>` : ''}
          ${t.costo ? `<div class="ticket-costo">$ ${Number(t.costo).toLocaleString('es-AR')}</div>` : ''}
          <div style="display:flex; gap:8px; margin-top:12px;">
            <button class="accion secundario btn-editar-trabajo" style="margin-top:0; flex:1; font-size:11px; padding:8px;" data-patente="${t.clienteUsuario}" data-id="${t.id}">Editar</button>
            <button class="accion secundario btn-eliminar-trabajo" style="margin-top:0; flex:1; font-size:11px; padding:8px; border-color:var(--rojo); color:var(--rojo);" data-patente="${t.clienteUsuario}" data-id="${t.id}">Eliminar</button>
          </div>
        </div>`;
      }).join('');
    document.querySelectorAll('.btn-eliminar-trabajo').forEach(btn => {
      btn.onclick = async () => {
        if(confirm('¿Seguro que querés eliminar este trabajo? No se puede deshacer.')){
          await eliminarTrabajo(btn.dataset.patente, btn.dataset.id);
          await pintarPanelTrabajos();
        }
      };
    });
    document.querySelectorAll('.btn-editar-trabajo').forEach(btn => {
      btn.onclick = () => {
        const t = trabajos.find(x => x.clienteUsuario === btn.dataset.patente && x.id === btn.dataset.id);
        if(!t) return;
        cargarTrabajoEnFormulario(btn.dataset.patente, btn.dataset.id, t);
      };
    });
  }
  pintarLista('');
  document.getElementById('buscarPatente').oninput = (e) => {
    pintarLista(e.target.value.toUpperCase().replace(/\s+/g,''));
  };
  document.getElementById('tCliente').onchange = (e) => {
    document.getElementById('buscarPatente').value = e.target.value;
    pintarLista(e.target.value);
  };
  document.getElementById('btnImprimir').onclick = () => {
    imprimirHistorial(filtroActual, filtradosActuales, clientes);
  };

  document.getElementById('btnCrearTrabajo').onclick = async () => {
    const clienteUsuario = document.getElementById('tCliente').value;
    const fecha = document.getElementById('tFecha').value;
    const descripcion = document.getElementById('tDescripcion').value.trim();
    const repuestos = document.getElementById('tRepuestos').value.trim();
    const costo = document.getElementById('tCosto').value;
    const kilometraje = document.getElementById('tKilometraje').value;
    const err = document.getElementById('trabajoError');
    if(!clienteUsuario || !fecha || !descripcion){
      err.textContent = 'Elegí un cliente, una fecha y cargá la descripción.'; return;
    }
    const cli = clientes.find(c => c.usuario === clienteUsuario);
    if(edicionActual){
      await actualizarTrabajo(edicionActual.patente, edicionActual.id, {
        fecha, descripcion, repuestos, costo, kilometraje,
        vehiculo: cli ? cli.vehiculo : ''
      });
    } else {
      await agregarTrabajo(clienteUsuario, {
        fecha, descripcion, repuestos, costo, kilometraje,
        vehiculo: cli ? cli.vehiculo : ''
      });
    }
    await pintarPanelTrabajos();
  };
}

  const cli = clientes.find(c => c.usuario === patente);
  const filas = ordenados.map(t => `

    <style>

      .sub{color:#5B6675; margin:0 0 24px; font-size:13px;}
      .sub b{color:#111827;}
      table{width:100%; border-collapse:collapse; margin-top:8px;}
      th{
        background:#F0F4F6; color:#0E7A8C; text-align:left; font-family:'Rajdhani',sans-serif;
        letter-spacing:1px; text-transform:uppercase; font-size:11px; padding:10px 10px;
        border-bottom:2px solid #0E7A8C;

      td{
        padding:9px 10px; font-size:12px; border-bottom:1px solid #E2E6EA;

      tr:nth-child(even) td{background:#F8FAFB;}
      td.col-angosta, th.col-angosta{white-space:nowrap; width:1%; padding-right:16px;}

    </style>
    </head><body>

    <table>
      <thead><tr><th class="col-angosta">Fecha</th><th class="col-angosta">Kilometraje</th><th>Descripción</th></tr></thead>
      <tbody>${filas}</tbody>
    </table>
    <div class="footer">Iberá 276, Avellaneda, Bs As  ·  11 3590-4193  ·  tinservice@gmail.com  ·  tinservice.com.ar</div>
    </body></html>
  `);
  w.document.close();
  w.print();
}
